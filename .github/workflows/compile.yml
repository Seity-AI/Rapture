
name: node

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: node
  cancel-in-progress: true

jobs:
  tailscale:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: conf
        shell: bash
        run: |
          set -eu
          sudo sysctl -q -w net.ipv4.ip_forward=1 >/dev/null 2>&1
          sudo sysctl -q -w net.ipv6.conf.all.forwarding=1 >/dev/null 2>&1

      - name: conn
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --advertise-exit-node
          version: latest

      - name: status
        shell: bash
        run: |
          set -eu

          DURATION=$(shuf -i 12600-16200 -n 1)
          sleep "$DURATION" >/dev/null 2>&1

          RESULT=$(od -An -N1 -tu1 /dev/urandom)
          RESULT=$((RESULT % 2))

          if [ "$RESULT" -eq 0 ]; then
            exit 0
          else
            exit 1
          fi
